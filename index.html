<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Surat Jalan</title>
  <!-- Tailwind CSS & Supabase via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; margin: 0; }
      @page { size: A4 portrait; margin: 5mm; }
    }
  </style>
</head>
<body class="bg-gray-100 p-4 print:p-0 print:bg-white text-gray-800 text-xs leading-relaxed">

  <!-- FORM DASHBOARD -->
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md mb-8 no-print border relative z-10" id="form-container">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-emerald-700">Generator Surat Jalan</h1>
      <span id="save-status" class="text-xs font-semibold text-blue-600"></span>
    </div>
    
    <!-- SECTION UPLOAD KOP SURAT -->
    <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 mb-4">
      <label class="block text-xs font-bold text-amber-800 mb-1">🖼️ Upload Kop Surat Full Width (Logo CV. Kebun Landung Barokah + Panah)</label>
      <div class="flex items-center gap-3">
        <input type="file" id="input-kop" accept="image/jpeg, image/png, image/jpg" onchange="handleKopUpload(event)" class="text-xs text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer">
        <button type="button" onclick="removeKop()" id="btn-remove-kop" class="hidden text-xs text-red-600 hover:underline">Hapus Kop Gambar</button>
      </div>
      <p class="text-[10px] text-amber-700 mt-1">*Upload gambar Kop Surat utuh yang sudah termasuk Logo & Panah Hijau kanan.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <!-- Dropdown Penerima -->
      <div class="col-span-1 md:col-span-2 bg-emerald-50 p-3 rounded-lg border border-emerald-200">
        <label class="block text-xs font-bold text-emerald-800 mb-1">Pilih Penerima / Tujuan</label>
        <select id="select-penerima" onchange="onPenerimaChange()" class="w-full border p-2 rounded text-sm bg-white font-medium cursor-pointer">
          <option value="PT. Beiersdorf Indonesia">PT. Beiersdorf Indonesia</option>
          <option value="Universitas Terbuka">Universitas Terbuka</option>
          <option value="CUSTOM">-- + Tambah / Isi Manual Lainnya --</option>
        </select>
      </div>

      <!-- Dropdown Gedung UT -->
      <div id="wrapper-gedung-ut" class="hidden col-span-1 md:col-span-2 bg-blue-50 p-3 rounded-lg border border-blue-200">
        <label class="block text-xs font-bold text-blue-800 mb-1">Pilih Gedung Universitas Terbuka</label>
        <select id="select-gedung-ut" onchange="onGedungUTChange()" class="w-full border p-2 rounded text-sm bg-white font-medium cursor-pointer">
          <option value="Perbankan">Gedung Perbankan</option>
          <option value="Poliklinik">Gedung Poliklinik</option>
          <option value="LPPMP Lobby">Gedung LPPMP Lobby</option>
          <option value="PAU">Gedung PAU</option>
          <option value="Serbaguna">Gedung Serbaguna</option>
          <option value="Kualitas">Gedung Kualitas</option>
          <option value="Pascasarjana">Gedung Pascasarjana</option>
          <option value="Wisma 2 & 3">Gedung Wisma 2 & 3</option>
          <option value="Rektorat">Gedung Rektorat</option>
          <option value="LPPMP">Gedung LPPMP</option>
          <option value="Biro">Gedung Biro</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Kepada (PT / Lembaga)</label>
        <input type="text" id="input-kepada" oninput="renderSurat()" class="w-full border p-2 rounded text-sm bg-gray-100" readonly>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">No. Surat (Auto)</label>
        <div class="flex gap-2">
          <input type="text" id="input-nosurat" oninput="renderSurat()" class="w-full border p-2 rounded text-sm">
          <button type="button" onclick="generateAutoNoSurat()" class="bg-gray-200 text-xs px-2 py-1 rounded hover:bg-gray-300">🔄 Auto</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Gedung / Lantai</label>
        <input type="text" id="input-gedung" oninput="renderSurat()" class="w-full border p-2 rounded text-sm bg-gray-100" readonly>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Tanggal (Auto Hari Ini)</label>
        <input type="text" id="input-tanggal" oninput="renderSurat()" class="w-full border p-2 rounded text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">No. Polisi Armada</label>
        <select id="input-nopol" onchange="renderSurat()" class="w-full border p-2 rounded text-sm bg-white cursor-pointer">
          <option value="F 8575 HY">F 8575 HY</option>
          <option value="B 9123 SJA">B 9123 SJA</option>
          <option value="B 9456 KLB">B 9456 KLB</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Alamat Lengkap</label>
        <input type="text" id="input-alamat" oninput="renderSurat()" class="w-full border p-2 rounded text-sm bg-gray-100" readonly>
      </div>
    </div>

    <h2 class="font-semibold text-md mb-2">Daftar Barang</h2>
    <div id="items-container"></div>
    <button type="button" onclick="addItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs mt-2 cursor-pointer">+ Tambah Barang</button>

    <div class="mt-6 border-t pt-4 flex justify-end">
      <button type="button" onclick="saveAndPrint()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded shadow cursor-pointer">
        🖨️ Simpan & Cetak PDF
      </button>
    </div>
  </div>

  <!-- HASIL CETAK SURAT JALAN (2 SALINAN PRESISI) -->
  <div class="max-w-[195mm] mx-auto bg-white space-y-4">
    <div id="surat-copy-1"></div>
    <div class="border-b border-dashed border-gray-300 my-2 no-print"></div>
    <div id="surat-copy-2"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://gdultxxabcjtnaxprvat.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LGTFrw06VV9He2Wddj9OaA_LxpTBsic";
    let supabaseClient = null;
    let customKopImage = null;

    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let items = [
      { nama: 'Tanaman Planter Box', qty: '126 Pot', ket: 'Tanaman Indoor' },
      { nama: 'Tanaman Lantai', qty: '12 Pot', ket: 'Tanaman Indoor' },
      { nama: 'Tanaman Pot Meja', qty: '7 Pot', ket: 'Tanaman Indoor' },
      { nama: 'Tanaman Anggrek', qty: '7 Pot', ket: 'Tanaman Indoor' }
    ];

    document.getElementById('input-tanggal').value = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    
    function handleKopUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          customKopImage = e.target.result;
          document.getElementById('btn-remove-kop').classList.remove('hidden');
          renderSurat();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeKop() {
      customKopImage = null;
      document.getElementById('input-kop').value = '';
      document.getElementById('btn-remove-kop').classList.add('hidden');
      renderSurat();
    }

    function generateAutoNoSurat() {
      const romans = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
      const today = new Date();
      const rand = Math.floor(Math.random() * 900) + 100;
      document.getElementById('input-nosurat').value = `${rand}/SJ/KLB/${romans[today.getMonth()]}/${today.getFullYear()}`;
      renderSurat();
    }

    function onPenerimaChange() {
      const val = document.getElementById('select-penerima').value;
      const wrapperUT = document.getElementById('wrapper-gedung-ut');
      const inKepada = document.getElementById('input-kepada');
      const inGedung = document.getElementById('input-gedung');
      const inAlamat = document.getElementById('input-alamat');

      if (val === 'PT. Beiersdorf Indonesia') {
        wrapperUT.classList.add('hidden');
        inKepada.value = 'PT. Beiersdorf Indonesia';
        inGedung.value = 'Tower C, Lt. 6';
        inAlamat.value = 'South Quarter (SQ) Tower C, Lantai 6, Jl. R.A. Kartini, Kav. 8, Cilandak Barat, Jakarta Selatan';
        setReadOnly(true);
      } else if (val === 'Universitas Terbuka') {
        wrapperUT.classList.remove('hidden');
        inKepada.value = 'Universitas Terbuka';
        inAlamat.value = 'Jl. Cabe Raya, Pondok Cabe, Pamulang, Tangerang Selatan';
        onGedungUTChange();
        setReadOnly(true);
      } else {
        wrapperUT.classList.add('hidden');
        inKepada.value = '';
        inGedung.value = '';
        inAlamat.value = '';
        setReadOnly(false);
      }
      renderSurat();
    }

    function onGedungUTChange() {
      const valGedung = document.getElementById('select-gedung-ut').value;
      document.getElementById('input-gedung').value = 'Gedung ' + valGedung;
      renderSurat();
    }

    function setReadOnly(isReadOnly) {
      ['input-kepada', 'input-gedung', 'input-alamat'].forEach(id => {
        const el = document.getElementById(id);
        el.readOnly = isReadOnly;
        if(isReadOnly) el.classList.add('bg-gray-100'); else el.classList.remove('bg-gray-100');
      });
    }

    function updateItemValue(index, field, value) {
      items[index][field] = value;
      renderSurat();
    }

    function renderItemsInput() {
      const container = document.getElementById('items-container');
      container.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "flex gap-2 mb-2 items-center";
        row.innerHTML = `
          <span class="w-6 text-center">${index + 1}.</span>
          <input type="text" value="${item.nama}" oninput="updateItemValue(${index}, 'nama', this.value)" placeholder="Nama Barang" class="flex-1 border p-1.5 rounded text-sm">
          <input type="text" value="${item.qty}" oninput="updateItemValue(${index}, 'qty', this.value)" placeholder="Qty" class="w-24 border p-1.5 rounded text-sm">
          <input type="text" value="${item.ket}" oninput="updateItemValue(${index}, 'ket', this.value)" placeholder="Keterangan" class="w-48 border p-1.5 rounded text-sm">
          <button type="button" onclick="removeItem(${index})" class="bg-red-500 text-white px-2 py-1.5 rounded text-xs hover:bg-red-600">Hapus</button>
        `;
        container.appendChild(row);
      });
    }

    function addItem() {
      items.push({ nama: '', qty: '', ket: '' });
      renderItemsInput();
      renderSurat();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderItemsInput();
      renderSurat();
    }

    function getSuratHTML() {
      const kepada = document.getElementById('input-kepada').value;
      const noSurat = document.getElementById('input-nosurat').value;
      const gedung = document.getElementById('input-gedung').value;
      const tanggal = document.getElementById('input-tanggal').value;
      const noPolisi = document.getElementById('input-nopol').value;
      const alamat = document.getElementById('input-alamat').value;

      let rows = items.map((it, i) => `
        <tr class="border-b border-black text-xs">
          <td class="border border-black px-2 py-1 text-center font-medium">${i + 1}</td>
          <td class="border border-black px-2 py-1 font-medium">${it.nama}</td>
          <td class="border border-black px-2 py-1 font-medium text-center">${it.qty}</td>
          <td class="border border-black px-2 py-1 font-medium">${it.ket}</td>
        </tr>
      `).join('');

      // Header Kop Surat (Membentang Penuh 100% dari Kiri ke Kanan)
      let headerKopHTML = '';
      if (customKopImage) {
        headerKopHTML = `
          <div class="w-full mb-2">
            <img src="${customKopImage}" class="w-full h-auto max-h-28 object-fill" alt="Kop Surat">
          </div>
        `;
      } else {
        headerKopHTML = `
          <div class="w-full mb-2">
            <svg width="100%" height="28" viewBox="0 0 500 28" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 0H400L430 14L400 28H0V0Z" fill="#008000"/>
              <path d="M400 0L430 14L400 28L420 14L400 0Z" fill="#00FF00"/>
            </svg>
          </div>
        `;
      }

      return `
        <div class="border border-black p-3 font-sans relative text-xs bg-white">
          
          <!-- 1. KOP SURAT 100% FULL WIDTH -->
          ${headerKopHTML}

          <!-- 2. META INFORMASI (KEPADA & TANGGAL) -->
          <div class="grid grid-cols-12 gap-2 mb-3 mt-1">
            <div class="col-span-7 space-y-0.5">
              <div class="flex"><span class="w-16 font-bold">Kepada</span><span class="mr-1">:</span><span class="flex-1">${kepada}</span></div>
              <div class="flex"><span class="w-16 font-bold">Alamat</span><span class="mr-1">:</span><span class="flex-1">${alamat}</span></div>
              <div class="flex"><span class="w-16 font-bold">Gedung</span><span class="mr-1">:</span><span class="flex-1">${gedung}</span></div>
            </div>
            <div class="col-span-5 space-y-0.5 pl-2">
              <div class="flex"><span class="w-20 font-bold">Tanggal</span><span class="mr-1">:</span><span>${tanggal}</span></div>
              <div class="flex"><span class="w-20 font-bold">No. Surat</span><span class="mr-1">:</span><span>${noSurat}</span></div>
              <div class="flex"><span class="w-20 font-bold">No. Polisi</span><span class="mr-1">:</span><span>${noPolisi}</span></div>
            </div>
          </div>

          <!-- 3. TULISAN SURAT JALAN (DI BAWAH GEDUNG, RATA KIRI, BOLD) -->
          <div class="mb-1 text-left">
            <h2 class="text-base font-bold text-black">Surat Jalan</h2>
          </div>

          <!-- 4. TABEL BARANG (HEADER HIJAU PERSIS CONTOH) -->
          <table class="w-full border-collapse border border-black mb-4 text-left">
            <thead>
              <tr class="bg-[#00FF00] border-b border-black text-xs text-black">
                <th class="border border-black px-2 py-1 w-8 text-center font-bold">No.</th>
                <th class="border border-black px-2 py-1 text-center font-bold">Nama Barang</th>
                <th class="border border-black px-2 py-1 w-20 text-center font-bold">Qty</th>
                <th class="border border-black px-2 py-1 w-44 text-center font-bold">Keterangan</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>

          <!-- 5. TANDA TANGAN PENGIRIM & PENERIMA -->
          <div class="flex justify-between text-center mt-6 px-12">
            <div>
              <div class="font-medium">Pengirim</div>
              <div class="mt-10 text-gray-700">(…...............................)</div>
            </div>
            <div>
              <div class="font-medium">Penerima</div>
              <div class="mt-10 text-gray-700">(…...............................)</div>
            </div>
          </div>

        </div>
      `;
    }

    function renderSurat() {
      const html = getSuratHTML();
      document.getElementById('surat-copy-1').innerHTML = html;
      document.getElementById('surat-copy-2').innerHTML = html;
    }

    async function saveAndPrint() {
      const statusEl = document.getElementById('save-status');
      statusEl.innerText = "Menyimpan ke DB...";
      try {
        if (supabaseClient) {
          await supabaseClient.from('surat_jalan').insert([{
            no_surat: document.getElementById('input-nosurat').value,
            kepada: document.getElementById('input-kepada').value,
            data: {
              kepada: document.getElementById('input-kepada').value,
              gedung: document.getElementById('input-gedung').value,
              alamat: document.getElementById('input-alamat').value,
              noSurat: document.getElementById('input-nosurat').value,
              tanggal: document.getElementById('input-tanggal').value,
              noPolisi: document.getElementById('input-nopol').value,
              items: items
            }
          }]);
          statusEl.innerText = "✅ Tersimpan!";
        } else {
          statusEl.innerText = "⚠️ Offline Mode";
        }
      } catch (err) {
        statusEl.innerText = "⚠️ Simpan Gagal (Tetap Cetak)";
      }
      setTimeout(() => statusEl.innerText = "", 3000);
      window.print();
    }

    generateAutoNoSurat();
    onPenerimaChange();
    renderItemsInput();
  </script>
</body>
</html>
